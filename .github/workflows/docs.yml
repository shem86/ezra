name: Docs

# The complement of ci.yml's `paths-ignore`. Between the two, every PR gets the
# doc reference check:
#
#   code-only PR   → ci.yml runs it   (this workflow is skipped)
#   docs-only PR   → this runs it     (ci.yml is skipped by paths-ignore)
#   mixed PR       → both run it      (~1s of duplication, not worth avoiding)
#
# Keeping the check in ci.yml alone would miss the broken-link class of rot,
# which is introduced by doc edits. Keeping it here alone would miss the
# symbol-rot class, which is introduced by code edits — the failure that
# motivated this. Neither trigger is sufficient on its own.

on:
  push:
    branches: [main]
    paths:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths:
      - '**.md'
      - 'docs/**'

jobs:
  refs:
    runs-on: ubuntu-latest
    # Reads the tree and nothing else; no packages, no deployments, no writes.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      # No pnpm install: the script imports only node builtins, so the whole
      # job is checkout + node. Deliberately kept dependency-free so it stays
      # cheap enough to run on every doc PR without anyone resenting it.
      - run: node scripts/check-doc-refs.ts
